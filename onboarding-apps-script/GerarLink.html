<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7F6;
    --surface: #FFFFFF;
    --surface-2: #EEF2EF;
    --ink: #1F2A24;
    --muted: #5B6B62;
    --accent: #2F7A5C;
    --accent-ink: #FFFFFF;
    --border: #DDE3DE;
    --radius: 14px;
    --ok-bg: #E3F2E9;
    --ok-ink: #1D6B41;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 64px; }
  .brand { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(1.5rem, 5vw, 1.9rem); margin: 0 0 8px; }
  .subtitle { color: var(--muted); font-size: 0.92rem; margin: 0 0 24px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 16px 0 8px; }
  label:first-child { margin-top: 0; }

  .servicos-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .servico-chip {
    display: flex; align-items: center; gap: 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
  }
  .servico-chip:has(input:checked) { border-color: var(--accent); background: var(--surface-2); color: var(--accent); }
  .servico-chip input { accent-color: var(--accent); }

  input[type="text"] {
    width: 100%; font: inherit; font-size: 0.92rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[readonly] { background: var(--surface-2); }

  button {
    display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 999px;
    padding: 12px 20px; font-size: 0.92rem; font-weight: 700; cursor: pointer; margin-top: 16px;
  }
  #btn-gerar { background: var(--accent); color: var(--accent-ink); }
  #btn-copiar { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); }
  #copiado-msg { font-size: 0.82rem; color: var(--ok-ink); margin-left: 10px; display: none; }

  .resultado { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); }
  .resultado[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">GMN — uso interno</p>
  <h1>Gerar link do formulário</h1>
  <p class="subtitle">Marque os serviços que este cliente contratou e copie o link certo pra mandar pra ele. Não mande o link desta página — só o link gerado abaixo.</p>

  <div class="card">
    <label>Serviços contratados por este cliente</label>
    <div class="servicos-row">
      <label class="servico-chip"><input type="checkbox" value="gbp"> Google Meu Negócio + Diretórios</label>
      <label class="servico-chip"><input type="checkbox" value="site"> Site</label>
      <label class="servico-chip"><input type="checkbox" value="biosite"> Biosite</label>
    </div>

    <button type="button" id="btn-gerar">Gerar link</button>

    <div class="resultado" id="resultado" hidden>
      <label for="link-gerado">Link pra mandar pro cliente</label>
      <input type="text" id="link-gerado" readonly>
      <button type="button" id="btn-copiar">Copiar link</button>
      <span id="copiado-msg">Copiado!</span>
    </div>
  </div>
</div>

<script>
  var checkboxes = document.querySelectorAll('.servicos-row input[type="checkbox"]');
  var resultadoEl = document.getElementById('resultado');
  var linkInput = document.getElementById('link-gerado');
  var copiadoMsg = document.getElementById('copiado-msg');

  document.getElementById('btn-gerar').addEventListener('click', function () {
    var selecionados = Array.prototype.filter.call(checkboxes, function (cb) { return cb.checked; })
      .map(function (cb) { return cb.value; });

    if (!selecionados.length) {
      alert('Marque pelo menos um serviço.');
      return;
    }

    var base = location.href.split('?')[0];
    var link = base + '?servicos=' + selecionados.join(',');
    linkInput.value = link;
    resultadoEl.hidden = false;
    copiadoMsg.style.display = 'none';
  });

  document.getElementById('btn-copiar').addEventListener('click', function () {
    linkInput.select();
    linkInput.setSelectionRange(0, 99999);
    try {
      document.execCommand('copy');
      copiadoMsg.style.display = 'inline';
    } catch (e) {
      alert('Não consegui copiar automaticamente — selecione e copie manualmente.');
    }
  });
</script>
</body>
</html>
