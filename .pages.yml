media:
  input: "public/img"
  output: "/img"

content:
  - name: "ferramentas"
    label: "🧰 Ferramentas"
    type: "file"
    path: "public/data/ferramentas.yaml"
    format: "yaml"
    fields:
      - name: "itens"
        label: "Ferramentas"
        type: "object"
        list: true
        fields:
          - name: "nome"
            label: "Nome"
            type: "string"
            required: true
          - name: "tipo"
            label: "Tipo"
            description: "Ex: Plataforma, Rede Social, Serviço, App"
            type: "string"
            required: true
          - name: "funcao"
            label: "Função/Área"
            description: "Ex: Automação WhatsApp, SEO Local, Agendamento"
            type: "string"
            required: true
          - name: "descricao"
            label: "Descrição"
            type: "text"
          - name: "link"
            label: "Link de acesso/login"
            type: "string"
          - name: "projetos"
            label: "Projetos onde é usada"
            description: "Ex: GMN. Pode adicionar quantos quiser."
            type: "string"
            list: true
          - name: "planoGratis"
            label: "Plano gratuito"
            type: "select"
            options:
              values:
                - value: "nenhum"
                  label: "Sem versão grátis"
                - value: "limitado"
                  label: "Grátis limitado"
                - value: "ilimitado"
                  label: "Grátis ilimitado"
          - name: "limiteGratis"
            label: "Qual o limite do grátis"
            description: "Só preencha se escolheu 'Grátis limitado' acima"
            type: "string"
          - name: "planoPago"
            label: "Plano básico pago (valor)"
            type: "string"
          - name: "verificadoEm"
            label: "Verificado em"
            description: "Data em que essas informações de preço/limite foram conferidas pela última vez"
            type: "date"
          - name: "tutoriais"
            label: "Tutoriais"
            description: "Sem limite de quantidade"
            type: "object"
            list: true
            fields:
              - name: "titulo"
                label: "Título do tutorial"
                type: "string"
              - name: "url"
                label: "Link"
                type: "string"

  - name: "sites"
    label: "🗂️ Meus Sites"
    type: "file"
    path: "public/data/sites.yaml"
    format: "yaml"
    fields:
      - name: "itens"
        label: "Sites"
        type: "object"
        list: true
        fields:
          - name: "icone"
            label: "Ícone (emoji)"
            type: "string"
          - name: "nome"
            label: "Nome"
            type: "string"
            required: true
          - name: "descricao"
            label: "Descrição curta"
            type: "string"
          - name: "siteUrl"
            label: "Link do site"
            type: "string"
          - name: "admUrl"
            label: "Link do Painel Admin"
            description: "Ex: /admin/ embutido no próprio site, quando existir"
            type: "string"
          - name: "cmsUrl"
            label: "Link do CMS"
            type: "string"

  - name: "estudos"
    label: "📚 Livros e Estudos"
    type: "file"
    path: "public/data/estudos.yaml"
    format: "yaml"
    fields:
      - name: "itens"
        label: "Itens de estudo"
        type: "object"
        list: true
        fields:
          - name: "titulo"
            label: "Título"
            type: "string"
            required: true
          - name: "tipo"
            label: "Tipo"
            type: "select"
            options:
              values:
                - value: "Livro"
                  label: "Livro"
                - value: "Vídeo"
                  label: "Vídeo"
                - value: "Artigo"
                  label: "Artigo"
          - name: "categoria"
            label: "Categoria"
            description: "Ex: Marketing, Investimentos, Desenvolvimento pessoal, Negócios"
            type: "string"
          - name: "status"
            label: "Status"
            type: "select"
            options:
              values:
                - value: "Não iniciado"
                  label: "Não iniciado"
                - value: "Em andamento"
                  label: "Em andamento"
                - value: "Concluído"
                  label: "Concluído"
                - value: "Para comprar"
                  label: "Para comprar"
          - name: "link"
            label: "Link (se for vídeo ou artigo online)"
            type: "string"
