itens:
  - nome: "ManyChat"
    tipo: "Plataforma"
    funcao: "Automação WhatsApp/Instagram"
    descricao: "Cria fluxos de resposta automática para Instagram Direct, WhatsApp e Messenger — atendimento e captação sem precisar responder tudo manualmente."
    link: "https://manychat.com/"
    projetos:
      - "GMN"
    planoGratis: "limitado"
    limiteGratis: "até 1.000 contatos, com recursos básicos de automação"
    planoPago: "a partir de ~US$15/mês (varia conforme número de contatos)"
    verificadoEm: "2026-09-16"
    tutoriais: []

