<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:96px}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Central de Ferramentas</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7F6;
    --surface: #FFFFFF;
    --surface-2: #EEF2EF;
    --ink: #1F2A24;
    --muted: #5B6B62;
    --accent: #2F7A5C;
    --accent-ink: #FFFFFF;
    --border: #DDE3DE;
    --radius: 14px;
    --ok-bg: #E3F2E9;
    --ok-ink: #1D6B41;
    --warn-bg: #FBEFE3;
    --warn-ink: #7A4A17;
    --off-bg: #F0EFEC;
    --off-ink: #6B675F;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815;
      --surface: #1B2320;
      --surface-2: #212B27;
      --ink: #EDF2EE;
      --muted: #9FB0A6;
      --accent: #4FAE82;
      --accent-ink: #0B140F;
      --border: #2A332E;
      --ok-bg: #16301F;
      --ok-ink: #7BD9A5;
      --warn-bg: #2E2416;
      --warn-ink: #E7BE8B;
      --off-bg: #262622;
      --off-ink: #A6A29A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121815;
    --surface: #1B2320;
    --surface-2: #212B27;
    --ink: #EDF2EE;
    --muted: #9FB0A6;
    --accent: #4FAE82;
    --accent-ink: #0B140F;
    --border: #2A332E;
    --ok-bg: #16301F;
    --ok-ink: #7BD9A5;
    --warn-bg: #2E2416;
    --warn-ink: #E7BE8B;
    --off-bg: #262622;
    --off-ink: #A6A29A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px 64px; }
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--bg); padding: 18px 16px 12px; border-bottom: 1px solid var(--border);
  }
  .topbar-inner { max-width: 820px; margin: 0 auto; }
  .eyebrow {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 4px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 6px; text-wrap: balance;
  }
  .subtitle { color: var(--muted); font-size: 0.92rem; margin: 0 0 14px; max-width: 62ch; }

  .topbar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .toggle-header {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .toggle-header:hover { border-color: var(--accent); color: var(--accent); }
  .toggle-icon { display: inline-block; font-size: 0.7rem; transition: transform 0.2s ease; }
  .topbar-collapsible {
    display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.2s ease;
  }
  .topbar-collapsible-inner { overflow: hidden; min-height: 0; transition: opacity 0.15s ease; }
  .topbar-collapsible.collapsed { grid-template-rows: 0fr; }
  .topbar-collapsible.collapsed .topbar-collapsible-inner { opacity: 0; }
  .top-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .top-nav a {
    display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600;
    color: var(--ink); text-decoration: none; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
  }
  .top-nav a:hover { border-color: var(--accent); }

  .search-box { position: relative; margin-bottom: 10px; }
  .search-box input {
    width: 100%; font: inherit; font-size: 0.95rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }

  .filter-group { margin-bottom: 8px; }
  .filter-group-label {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); margin: 10px 0 6px;
  }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 0.78rem; font-weight: 600; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    user-select: none;
  }
  .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .clear-filters {
    font-size: 0.76rem; color: var(--accent); font-weight: 600; cursor: pointer;
    background: none; border: none; padding: 5px 4px; display: none;
  }
  .clear-filters.show { display: inline-block; }

  .result-count { font-size: 0.8rem; color: var(--muted); margin: 14px 0 10px; }

  .tool-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px;
  }
  .tool-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .tool-name { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.05rem; margin: 0; }
  .tool-link {
    flex-shrink: 0; font-size: 0.78rem; font-weight: 600; color: var(--accent-ink); background: var(--accent);
    border-radius: 999px; padding: 5px 12px; text-decoration: none;
  }
  .tool-link:hover { opacity: 0.9; }
  .tool-tags { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0 8px; }
  .tag {
    font-size: 0.72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  }
  .tag.tag-projeto { background: var(--surface-2); color: var(--accent); border-color: var(--accent); }
  .tool-desc { color: var(--ink); font-size: 0.88rem; margin: 0 0 10px; max-width: 68ch; }

  .plan-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .plan-badge {
    font-size: 0.76rem; font-weight: 600; padding: 4px 10px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .plan-badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .plan-badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .plan-badge.off { background: var(--off-bg); color: var(--off-ink); }
  .verified-note { font-size: 0.72rem; color: var(--muted); }

  .tutorials { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 4px; }
  .tutorials-label { font-size: 0.76rem; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .tutorials ul { margin: 0; padding: 0 0 0 18px; }
  .tutorials li { font-size: 0.82rem; margin-bottom: 2px; }
  .tutorials a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .tutorials a:hover { text-decoration: underline; }

  .empty-state { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 40px 0; }

  .section-title {
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.2rem;
    margin: 24px 0 12px;
  }
  .site-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 10px;
  }
  .site-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .site-icon { font-size: 1.15rem; line-height: 1; }
  .site-name { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 0.98rem; margin: 0; }
  .site-desc { color: var(--muted); font-size: 0.84rem; margin: 0 0 8px; }
  .site-links { border-top: 1px dashed var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .site-links-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.8rem; flex-wrap: wrap; }
  .site-links-label { font-weight: 600; color: var(--ink); flex-shrink: 0; min-width: 80px; }
  .site-links-row a { color: var(--accent); font-weight: 600; text-decoration: none; word-break: break-all; }
  .site-links-row a:hover { text-decoration: underline; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-head">
      <div class="topbar-head-text">
        <p class="eyebrow">Acesso interno</p>
        <h1>Central de Ferramentas</h1>
      </div>
      <button type="button" class="toggle-header" id="toggle-header" aria-expanded="true" aria-label="Recolher cabeçalho">
        <span class="toggle-icon">▲</span>
      </button>
    </div>
    <div class="topbar-collapsible" id="topbar-collapsible">
      <div class="topbar-collapsible-inner">
        <p class="subtitle">Inventário das ferramentas usadas no processo de trabalho — busca e filtros por tipo, função e projeto.</p>
        <div class="search-box">
          <input type="text" id="busca" placeholder="Buscar por nome ou descrição...">
        </div>
        <div id="filtros"></div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">

  <h2 class="section-title">🗂️ Meus Sites</h2>
  <div id="lista-sites"></div>

  <hr class="divider">

  <h2 class="section-title">🧰 Ferramentas</h2>
  <p class="result-count" id="contagem"></p>
  <div id="lista"></div>
  <div class="empty-state" id="vazio" hidden>Nenhuma ferramenta encontrada com esses filtros.</div>
</div>

<script>
let FERRAMENTAS = [];
let SITES = [];
const FERRAMENTAS_SEED = [
  {
    nome: "ManyChat",
    tipo: "Plataforma",
    funcao: "Automação WhatsApp/Instagram",
    descricao: "Cria fluxos de resposta automática para Instagram Direct, WhatsApp e Messenger — atendimento e captação sem precisar responder tudo manualmente.",
    link: "https://manychat.com/",
    projetos: ["GMN"],
    planoGratis: "limitado",
    limiteGratis: "até 1.000 contatos, com recursos básicos de automação",
    planoPago: "a partir de ~US$15/mês (varia conforme número de contatos)",
    verificadoEm: "2026-09-16",
    tutoriais: []
  },
  {
    nome: "Metricool",
    tipo: "Plataforma",
    funcao: "Agendamento e Analytics de Redes Sociais",
    descricao: "Agenda publicações em várias redes de uma vez só e gera relatórios de desempenho, tudo em um único painel.",
    link: "https://metricool.com/",
    projetos: ["GMN"],
    planoGratis: "limitado",
    limiteGratis: "1 marca/perfil, com funções básicas de agendamento e métricas",
    planoPago: "a partir de ~US$18/mês (planos variam por número de marcas e recursos)",
    verificadoEm: "2026-09-16",
    tutoriais: []
  },
  {
    nome: "Meta Business Suite",
    tipo: "Plataforma",
    funcao: "Gestão de Instagram e Facebook",
    descricao: "Painel oficial da Meta para gerenciar Instagram e Facebook juntos: mensagens, publicações agendadas e anúncios.",
    link: "https://business.facebook.com/",
    projetos: ["GMN"],
    planoGratis: "ilimitado",
    limiteGratis: "",
    planoPago: "Sem mensalidade fixa — só o investimento em anúncios, que é variável",
    verificadoEm: "2026-09-16",
    tutoriais: []
  },
  {
    nome: "Local Falcon",
    tipo: "Plataforma",
    funcao: "SEO Local — Ranking no Google Maps",
    descricao: "Mostra como o negócio aparece no Google Maps em vários pontos geográficos ao redor, ajudando a identificar onde o SEO local precisa melhorar.",
    link: "https://www.localfalcon.com/",
    projetos: ["GMN"],
    planoGratis: "limitado",
    limiteGratis: "alguns escaneamentos de teste grátis ao criar a conta",
    planoPago: "a partir de ~US$20/mês (ou pacotes avulsos por escaneamento)",
    verificadoEm: "2026-09-16",
    tutoriais: []
  },
  {
    nome: "Google Search Console",
    tipo: "Plataforma",
    funcao: "SEO — Monitoramento de Buscas",
    descricao: "Ferramenta oficial do Google para ver como o site aparece nas buscas, quais termos trazem visitas, e corrigir problemas técnicos de indexação.",
    link: "https://search.google.com/search-console",
    projetos: ["GMN"],
    planoGratis: "ilimitado",
    limiteGratis: "",
    planoPago: "",
    verificadoEm: "2026-09-16",
    tutoriais: []
  },
  {
    nome: "Whitespark (Local Citation Finder)",
    tipo: "Plataforma",
    funcao: "SEO Local — Sondagem de Diretórios/Concorrentes",
    descricao: "Encontra em quais diretórios e plataformas os concorrentes estão listados, para identificar onde também cadastrar o negócio (citações locais).",
    link: "https://whitespark.ca/local-citation-finder/",
    projetos: ["GMN"],
    planoGratis: "limitado",
    limiteGratis: "número reduzido de buscas grátis por conta",
    planoPago: "a partir de ~US$30/mês",
    verificadoEm: "2026-09-16",
    tutoriais: []
  }
];

const SITES_SEED = [];

function $(id) { return document.getElementById(id); }

function renderSites() {
  $("lista-sites").innerHTML = SITES.map(s => `
    <div class="site-card">
      <div class="site-head"><span class="site-icon">${s.icone || "🔗"}</span><h3 class="site-name">${s.nome}</h3></div>
      ${s.descricao ? `<p class="site-desc">${s.descricao}</p>` : ""}
      <div class="site-links">
        ${s.siteUrl ? `<div class="site-links-row"><span class="site-links-label">🌐 Site</span><a href="${s.siteUrl}" target="_blank" rel="noopener">${s.siteUrl.replace(/^https?:\/\//, "")}</a></div>` : ""}
        ${s.cmsUrl ? `<div class="site-links-row"><span class="site-links-label">✏️ CMS</span><a href="${s.cmsUrl}" target="_blank" rel="noopener">${s.cmsUrl.replace(/^https?:\/\//, "")}</a></div>` : ""}
      </div>
    </div>
  `).join("");
}

let filtroAtivo = { tipo: null, funcao: null, projeto: null };
let termoBusca = "";

function valoresUnicos(campo) {
  const set = new Set();
  FERRAMENTAS.forEach(f => {
    if (campo === "projetos") {
      f.projetos.forEach(p => set.add(p));
    } else {
      set.add(f[campo]);
    }
  });
  return Array.from(set).sort();
}

function renderFiltros() {
  const grupos = [
    { chave: "tipo", label: "Tipo", valores: valoresUnicos("tipo") },
    { chave: "funcao", label: "Função", valores: valoresUnicos("funcao") },
    { chave: "projeto", label: "Projeto", valores: valoresUnicos("projetos") }
  ];
  const html = grupos.map(g => `
    <div class="filter-group">
      <p class="filter-group-label">${g.label}</p>
      <div class="chip-row">
        ${g.valores.map(v => `<span class="chip ${filtroAtivo[g.chave] === v ? "active" : ""}" data-grupo="${g.chave}" data-valor="${v}">${v}</span>`).join("")}
      </div>
    </div>
  `).join("") + `<button class="clear-filters ${(filtroAtivo.tipo || filtroAtivo.funcao || filtroAtivo.projeto) ? "show" : ""}" id="limpar-filtros">Limpar filtros</button>`;
  $("filtros").innerHTML = html;

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const grupo = chip.dataset.grupo;
      const valor = chip.dataset.valor;
      filtroAtivo[grupo] = filtroAtivo[grupo] === valor ? null : valor;
      renderFiltros();
      renderLista();
    });
  });
  const limpar = $("limpar-filtros");
  if (limpar) {
    limpar.addEventListener("click", () => {
      filtroAtivo = { tipo: null, funcao: null, projeto: null };
      renderFiltros();
      renderLista();
    });
  }
}

function planoBadges(f) {
  let badges = "";
  if (f.planoGratis === "ilimitado") {
    badges += `<span class="plan-badge ok">✓ Grátis ilimitado</span>`;
  } else if (f.planoGratis === "limitado") {
    badges += `<span class="plan-badge warn">⚠ Grátis limitado${f.limiteGratis ? " — " + f.limiteGratis : ""}</span>`;
  } else {
    badges += `<span class="plan-badge off">Sem versão grátis</span>`;
  }
  if (f.planoPago) {
    badges += `<span class="plan-badge off">💳 ${f.planoPago}</span>`;
  }
  return badges;
}

function renderLista() {
  const termo = termoBusca.trim().toLowerCase();
  const filtradas = FERRAMENTAS.filter(f => {
    if (termo && !(f.nome.toLowerCase().includes(termo) || f.descricao.toLowerCase().includes(termo))) return false;
    if (filtroAtivo.tipo && f.tipo !== filtroAtivo.tipo) return false;
    if (filtroAtivo.funcao && f.funcao !== filtroAtivo.funcao) return false;
    if (filtroAtivo.projeto && !f.projetos.includes(filtroAtivo.projeto)) return false;
    return true;
  });

  $("contagem").textContent = filtradas.length === FERRAMENTAS.length
    ? `${FERRAMENTAS.length} ferramenta(s) cadastrada(s)`
    : `${filtradas.length} de ${FERRAMENTAS.length} ferramenta(s)`;

  $("vazio").hidden = filtradas.length > 0;

  $("lista").innerHTML = filtradas.map(f => `
    <div class="tool-card">
      <div class="tool-top">
        <h3 class="tool-name">${f.nome}</h3>
        ${f.link ? `<a class="tool-link" href="${f.link}" target="_blank" rel="noopener">🔗 Acessar</a>` : ""}
      </div>
      <div class="tool-tags">
        <span class="tag">${f.tipo}</span>
        <span class="tag">${f.funcao}</span>
        ${f.projetos.map(p => `<span class="tag tag-projeto">${p}</span>`).join("")}
      </div>
      <p class="tool-desc">${f.descricao}</p>
      <div class="plan-row">${planoBadges(f)}</div>
      <p class="verified-note">Verificado em: ${f.verificadoEm}</p>
      ${f.tutoriais.length > 0 ? `
        <div class="tutorials">
          <p class="tutorials-label">🎥 Tutoriais</p>
          <ul>${f.tutoriais.map(t => `<li><a href="${t.url}" target="_blank" rel="noopener">${t.titulo}</a></li>`).join("")}</ul>
        </div>
      ` : ""}
    </div>
  `).join("");
}

$("busca").addEventListener("input", (e) => {
  termoBusca = e.target.value;
  renderLista();
});

async function carregarDados() {
  try {
    const [rFerramentas, rSites] = await Promise.all([
      fetch("/data/ferramentas.yaml", { cache: "no-store" }),
      fetch("/data/sites.yaml", { cache: "no-store" })
    ]);
    const dadosFerramentas = rFerramentas.ok ? jsyaml.load(await rFerramentas.text()) : null;
    const dadosSites = rSites.ok ? jsyaml.load(await rSites.text()) : null;
    FERRAMENTAS = (dadosFerramentas && dadosFerramentas.itens) || FERRAMENTAS_SEED;
    SITES = (dadosSites && dadosSites.itens) || SITES_SEED;
  } catch (e) {
    FERRAMENTAS = FERRAMENTAS_SEED;
    SITES = SITES_SEED;
  }
  renderSites();
  renderFiltros();
  renderLista();
}

carregarDados();

(function () {
  const toggleBtn = $("toggle-header");
  const collapsible = $("topbar-collapsible");
  const icon = toggleBtn.querySelector(".toggle-icon");

  function aplicarEstado(colapsado) {
    collapsible.classList.toggle("collapsed", colapsado);
    toggleBtn.setAttribute("aria-expanded", String(!colapsado));
    toggleBtn.setAttribute("aria-label", colapsado ? "Expandir cabeçalho" : "Recolher cabeçalho");
    icon.textContent = colapsado ? "▼" : "▲";
  }

  let colapsado = false;
  try { colapsado = localStorage.getItem("cf-header-colapsado") === "1"; } catch (e) {}
  aplicarEstado(colapsado);

  toggleBtn.addEventListener("click", () => {
    colapsado = !colapsado;
    aplicarEstado(colapsado);
    try { localStorage.setItem("cf-header-colapsado", colapsado ? "1" : "0"); } catch (e) {}
  });
})();
</script>

</body></html>
